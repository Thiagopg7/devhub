openapi: 3.0.3

info:
  title: DevHub API
  description: |
    API REST do DevHub — plataforma de blog e portfólio.

    ## Autenticação
    Todos os endpoints (exceto `POST /auth/login`) exigem um token Bearer obtido via login.

    Inclua o header em todas as requisições autenticadas:
    ```
    Authorization: Bearer {token}
    ```
  version: 1.0.0

servers:
  - url: https://devhub-production-a6a5.up.railway.app/api
    description: Produção
  - url: http://devhub.local/api
    description: Local

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Autenticação e gerenciamento de sessão
  - name: Posts
    description: Artigos publicados
  - name: Categories
    description: Categorias de posts
  - name: Pages
    description: Páginas estáticas
  - name: Menu
    description: Itens de navegação
  - name: Technologies
    description: Tecnologias do portfólio
  - name: System
    description: Saúde e status da API
  - name: Events
    description: Eventos da agenda
  - name: Testimonials
    description: Depoimentos
  - name: Stack
    description: Stack de tecnologias do projeto
  - name: Config
    description: Configurações públicas do site
  - name: Newsletter
    description: Inscrição na newsletter

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token

  schemas:
    Category:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Desenvolvimento Web
        slug:
          type: string
          example: desenvolvimento-web
        color:
          type: string
          example: "#3B82F6"
        description:
          type: string
          nullable: true
          example: Artigos sobre front-end, back-end e APIs.
        posts_count:
          type: integer
          example: 5

    PostSummary:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: Começando com Laravel
        slug:
          type: string
          example: comecando-com-laravel
        description:
          type: string
          nullable: true
        banner_image:
          type: string
          nullable: true
          example: https://devhub-production-a6a5.up.railway.app/storage/posts/banner.jpg
        category:
          $ref: '#/components/schemas/CategoryRef'
        meta_title:
          type: string
          nullable: true
        meta_description:
          type: string
          nullable: true
        is_featured:
          type: boolean
          description: Indica se o post é o destaque atual da home (só um por vez).
          example: false
        published_at:
          type: string
          format: date-time
          description: >-
            Data de publicação do post. Posts com data futura ficam agendados e
            não são retornados pela API até a data chegar.
          example: "2026-05-01T00:00:00+00:00"

    PostDetail:
      allOf:
        - $ref: '#/components/schemas/PostSummary'
        - type: object
          properties:
            content:
              type: string
              example: "<p>Conteúdo completo do post em HTML...</p>"

    CategoryRef:
      type: object
      nullable: true
      properties:
        name:
          type: string
          example: Desenvolvimento Web
        slug:
          type: string
          example: desenvolvimento-web
        color:
          type: string
          example: "#3B82F6"

    Page:
      type: object
      properties:
        title:
          type: string
          example: Sobre Nós
        slug:
          type: string
          example: sobre-nos
        subtitle:
          type: string
          nullable: true
        eyebrow:
          type: string
          nullable: true
        content:
          type: string
          nullable: true
        main_image:
          type: string
          nullable: true
        gallery:
          type: array
          items:
            type: string
          example: []
        meta_title:
          type: string
          nullable: true
        meta_description:
          type: string
          nullable: true

    MenuItem:
      type: object
      properties:
        label:
          type: string
          example: Blog
        url:
          type: string
          example: /blog
        open_in_new_tab:
          type: boolean
          example: false
        children:
          type: array
          items:
            $ref: '#/components/schemas/MenuItem'

    Technology:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Laravel
        description:
          type: string
          nullable: true
          example: Framework PHP para aplicações web.
        url:
          type: string
          nullable: true
          example: https://laravel.com
        icon_image:
          type: string
          nullable: true
          example: https://devhub-production-a6a5.up.railway.app/storage/technologies/laravel.svg
        screenshot_image:
          type: string
          nullable: true
          example: https://devhub-production-a6a5.up.railway.app/storage/technologies/laravel-screenshot.png
        order:
          type: integer
          example: 1

    Event:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: PHP Conference Brasil 2026
        type:
          type: string
          enum: [conf, meetup, workshop, hack]
          example: conf
        type_label:
          type: string
          example: Conferência
        org:
          type: string
          nullable: true
          example: PHP Conference Brasil
        date:
          type: string
          format: date
          example: "2026-04-18"
        day:
          type: string
          example: "18"
        month:
          type: string
          example: Abr
        year:
          type: string
          example: "2026"
        time:
          type: string
          nullable: true
          example: "09h00 – 18h00"
        location:
          type: string
          nullable: true
          example: São Paulo, SP
        is_online:
          type: boolean
          example: false
        status:
          type: string
          example: open
        is_past:
          type: boolean
          example: false
        cta_label:
          type: string
          nullable: true
        cta_style:
          type: string
          nullable: true
        cta_url:
          type: string
          nullable: true
        seats:
          type: string
          nullable: true
        seats_low:
          type: boolean
          example: false

    Testimonial:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Mariana Lopes
        role:
          type: string
          nullable: true
          example: Desenvolvedora Full-Stack
        company:
          type: string
          nullable: true
          example: Finova
        content:
          type: string
          example: Os artigos do DevHub viraram leitura obrigatória.
        avatar_image:
          type: string
          nullable: true

    StackItem:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Laravel
        icon:
          type: string
          description: SVG inline do ícone.
          example: "<svg viewBox=\"0 0 24 24\">...</svg>"

    ConfigData:
      type: object
      description: Configurações públicas agrupadas (scripts/analytics não são expostos).
      properties:
        general:
          type: object
          additionalProperties:
            type: string
          example: { site_name: DevHub, site_tagline: "Blog e portfólio de desenvolvimento web" }
        contact:
          type: object
          additionalProperties:
            type: string
          example: { contact_email: contato@devhub.com.br }
        footer:
          type: object
          additionalProperties:
            type: string
          example: { footer_github: "https://github.com/thiagopg7" }

    Pagination:
      type: object
      properties:
        current_page:
          type: integer
        last_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        next_page_url:
          type: string
          nullable: true
        prev_page_url:
          type: string
          nullable: true

    Health:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded]
          example: ok
        checks:
          type: object
          properties:
            database:
              type: string
              enum: [up, down]
              example: up
            cache:
              type: string
              enum: [up, down]
              example: up

    Error:
      type: object
      properties:
        message:
          type: string

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Realizar login
      description: Autentica o usuário e retorna um token Sanctum.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: demo@devhub.com
                password:
                  type: string
                  example: Demo@123
                device_name:
                  type: string
                  example: meu-app
                  description: Nome do dispositivo para identificar o token (opcional)
      responses:
        "200":
          description: Login bem-sucedido
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: "1|abc123def456..."
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      email:
                        type: string
        "422":
          description: Credenciais inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "429":
          description: "Muitas tentativas (limite: 10 por minuto)"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Encerrar sessão
      description: Revoga o token atual.
      responses:
        "200":
          description: Sessão encerrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Sessão encerrada com sucesso.
        "401":
          description: Não autenticado

  /auth/me:
    get:
      tags: [Auth]
      summary: Dados do usuário autenticado
      description: Retorna perfil completo com papéis e permissões.
      responses:
        "200":
          description: Dados do usuário
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  email:
                    type: string
                  is_super_admin:
                    type: boolean
                  roles:
                    type: array
                    items:
                      type: string
                    example: [Visualizador]
                  permissions:
                    type: array
                    items:
                      type: string
                    example: [posts.view, categories.view]
        "401":
          description: Não autenticado

  /posts:
    get:
      tags: [Posts]
      summary: Listar posts
      description: Retorna posts ativos paginados. Filtrável por categoria.
      parameters:
        - name: category
          in: query
          description: Slug da categoria para filtrar
          required: false
          schema:
            type: string
            example: desenvolvimento-web
        - name: page
          in: query
          description: Número da página
          required: false
          schema:
            type: integer
            default: 1
      responses:
        "200":
          description: Lista de posts paginada
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PostSummary'
                  - $ref: '#/components/schemas/Pagination'
        "404":
          description: Categoria não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Não autenticado

  /posts/{slug}:
    get:
      tags: [Posts]
      summary: Detalhe de um post
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            example: comecando-com-laravel
      responses:
        "200":
          description: Post encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PostDetail'
        "404":
          description: Post não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Não autenticado

  /categories:
    get:
      tags: [Categories]
      summary: Listar categorias
      description: Retorna todas as categorias ativas com contagem de posts.
      responses:
        "200":
          description: Lista de categorias
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
        "401":
          description: Não autenticado

  /categories/{slug}:
    get:
      tags: [Categories]
      summary: Detalhe de uma categoria
      description: Retorna a categoria e seus posts publicados.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            example: desenvolvimento-web
      responses:
        "200":
          description: Categoria encontrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/Category'
                      - type: object
                        properties:
                          posts:
                            type: array
                            items:
                              $ref: '#/components/schemas/PostSummary'
        "404":
          description: Categoria não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Não autenticado

  /pages:
    get:
      tags: [Pages]
      summary: Listar páginas
      description: Retorna as páginas ativas e pesquisáveis.
      responses:
        "200":
          description: Lista de páginas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Page'
        "401":
          description: Não autenticado

  /pages/{slug}:
    get:
      tags: [Pages]
      summary: Detalhe de uma página
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            example: sobre-nos
      responses:
        "200":
          description: Página encontrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Page'
        "404":
          description: Página não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Não autenticado

  /menu:
    get:
      tags: [Menu]
      summary: Itens de navegação
      description: Retorna a árvore de menu (raízes com seus filhos) ordenada.
      responses:
        "200":
          description: Árvore de menu
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MenuItem'
        "401":
          description: Não autenticado

  /technologies:
    get:
      tags: [Technologies]
      summary: Listar tecnologias
      description: Retorna as tecnologias ativas ordenadas pelo campo `order`.
      responses:
        "200":
          description: Lista de tecnologias
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Technology'
        "401":
          description: Não autenticado

  /events:
    get:
      tags: [Events]
      summary: Listar eventos
      description: Retorna eventos ativos ordenados por data. Filtrável por período e tipo.
      parameters:
        - name: when
          in: query
          required: false
          description: Filtra por período.
          schema:
            type: string
            enum: [all, upcoming, past]
            default: all
        - name: type
          in: query
          required: false
          description: Filtra por tipo de evento.
          schema:
            type: string
            enum: [conf, meetup, workshop, hack]
      responses:
        "200":
          description: Lista de eventos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Event'
        "401":
          description: Não autenticado

  /testimonials:
    get:
      tags: [Testimonials]
      summary: Listar depoimentos
      description: Retorna os depoimentos ativos ordenados.
      responses:
        "200":
          description: Lista de depoimentos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Testimonial'
        "401":
          description: Não autenticado

  /stack:
    get:
      tags: [Stack]
      summary: Listar itens do stack
      description: Retorna o stack de tecnologias do projeto, ativo e ordenado.
      responses:
        "200":
          description: Lista do stack
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/StackItem'
        "401":
          description: Não autenticado

  /config:
    get:
      tags: [Config]
      summary: Configurações públicas
      description: Retorna as configurações públicas do site (geral, contato, rodapé).
      responses:
        "200":
          description: Configurações
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ConfigData'
        "401":
          description: Não autenticado

  /newsletter:
    post:
      tags: [Newsletter]
      summary: Inscrever na newsletter
      description: >-
        Endpoint público de escrita. Protegido por rate limit agressivo
        (5 req/min por IP), honeypot, e-mail único e sanitização anti-injeção.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, newsletter_area_id, lgpd_consent]
              properties:
                name:
                  type: string
                  maxLength: 100
                  example: Maria Silva
                email:
                  type: string
                  format: email
                  maxLength: 254
                  example: maria@example.com
                newsletter_area_id:
                  type: integer
                  example: 1
                lgpd_consent:
                  type: boolean
                  description: Consentimento LGPD (obrigatório).
                  example: true
                website:
                  type: string
                  nullable: true
                  description: Honeypot — deve ficar vazio (bots preenchem).
      responses:
        "201":
          description: Inscrição realizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Inscrição realizada com sucesso!
        "422":
          description: Dados inválidos (e-mail já inscrito, consentimento ausente etc.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "429":
          description: "Muitas tentativas (limite: 5 por minuto por IP)"

  /health:
    get:
      tags: [System]
      summary: Health check
      description: Verifica a conectividade com o banco de dados e o cache. Público (sem autenticação).
      security: []
      responses:
        "200":
          description: Todos os componentes operacionais
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        "503":
          description: Algum componente indisponível
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
