; Em produção o php-fpm escuta num Unix socket (não em TCP 127.0.0.1:9000).
; Isso torna o restart resiliente: se o master morrer e deixar workers órfãos,
; o novo master remove e recria o socket — sem o erro "Address already in use"
; que prende a porta TCP. Prefixo zz- garante que carrega depois do www.conf.
[www]
listen = /run/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Controle de memória: o padrão (pm=dynamic, 5 workers de ~100 MB cada) estoura
; containers pequenos e mata o worker (OOM) na página mais pesada → 502.
; ondemand sobe workers só quando há requisição e encerra os ociosos.
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 10s
pm.max_requests = 300
